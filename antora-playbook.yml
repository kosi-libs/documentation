site:
  title: Kodein Open Source Initiative Documentation
  url: https://kosi-libs.org
  start_page: kosi-libs::index.adoc
  robots: allow
antora:
  extensions:
    - require: '@antora-supplemental/unversioned-component-urls'
      mode: alias
content:
  sources:
    - url: ./
      branches: master
      start_path: home
    - url: https://github.com/kosi-libs/Inara.git
      branches: 'release/v{0..9}*'
      start_path: doc
    - url: https://github.com/kosi-libs/Nomi.git
      branches: 'release/v{0..9}*'
      start_path: doc
    - url: https://github.com/kosi-libs/MocKMP.git
      branches: 'release/v{0..9}*'
      start_path: doc
    - url: https://github.com/kosi-libs/Kodein.git
      branches: 'release/v{0..9}*'
      start_path: doc
    - url: https://github.com/kosi-libs/VIE.git
      branches: 'release/v{0..9}*'
      start_path: doc
ui:
  bundle:
    url: https://github.com/kosi-libs/documentation-ui/raw/kosi/build/ui-bundle-v1.4.2.zip
  supplemental_files:
  - path: ui.yml
    contents: |
      static_files: [ .nojekyll ]
  - path: .nojekyll
urls:
  redirect_facility: 'static'
output:
  dir: docs
