site:
  title: Kodein Open Source Initiative Documentation
  url: https://kosi-libs.org
  start_page: kosi-libs::index.adoc
  robots: allow
  keys:
    navbar_title: Kodein Open Source Initiative
    navbar_button_label: KOSI Libs
    home_component: kosi-libs
    github_url: https://github.com/kosi-libs
    footer_text: 'Kosi Libs &mdash; open source libraries by <a href="https://kodein-koders.com">Kodein Koders</a>, Kotlin Multiplatform experts.'
antora:
  extensions:
    - require: '@antora-supplemental/unversioned-component-urls'
      mode: alias
content:
  sources:
    - url: ./
      branches: master
      start_path: home
    - url: https://github.com/kosi-libs/Inara.git
      branches: 'release/v{0..9}*'
      start_path: doc
    - url: https://github.com/kosi-libs/Nomi.git
      branches: 'release/v{0..9}*'
      start_path: doc
    - url: https://github.com/kosi-libs/MocKMP.git
      branches: 'release/v{0..9}*'
      start_path: doc
    - url: https://github.com/kosi-libs/Kodein.git
      branches: 'release/v{0..9}*'
      start_path: doc
    - url: https://github.com/kosi-libs/VIE.git
      branches: 'release/v{0..9}*'
      start_path: doc
ui:
  bundle:
    url: https://github.com/KodeinKoders/Antora-Kodein-UI/releases/latest/download/ui-bundle.zip
    snapshot: true
urls:
  redirect_facility: 'static'
output:
  dir: docs
